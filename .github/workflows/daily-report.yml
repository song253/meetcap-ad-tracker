name: Daily Meta Ad Library Report

on:
  schedule:
    # 매일 08:00 KST = 전날 23:00 UTC
    - cron: "0 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scrape today's snapshot
        run: python scripts/scrape_daily.py

      - name: Send Discord report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py

      - name: Commit snapshot
        run: |
          git config user.name "meetcap-ad-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots/
          git diff --cached --quiet || git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
          git push
